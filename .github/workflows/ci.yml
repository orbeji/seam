name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: no Git repository or Electron process is started here.
  check:
    name: Check · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Check dependency licences
        run: npm run licenses:check

  # The integration suite drives the real Git executable. It runs on both
  # platforms so path, CRLF and process-handling differences are caught.
  integration:
    name: Integration · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # The oldest Git the application supports, built from source once per run.
  # This proves the commands and parsers still work on 2.30, not only on the
  # version the runner happens to ship.
  integration-git-2-30:
    name: Integration · Git 2.30
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Git 2.30
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libexpat1-dev gettext zlib1g-dev
          curl -fsSL https://github.com/git/git/archive/refs/tags/v2.30.2.tar.gz | tar -xz
          # NO_CURL: Git 2.30.2 does not compile against libcurl 8 (its
          # CURLFTPSSL_TRY compatibility macro was removed), and the
          # integration suite only exercises local repositories anyway.
          make -C git-2.30.2 -j"$(nproc)" NO_TCLTK=1 NO_GETTEXT=1 NO_CURL=1 prefix="$RUNNER_TEMP/git-2.30" install
          echo "$RUNNER_TEMP/git-2.30/bin" >> "$GITHUB_PATH"

      - name: Show Git version
        run: git --version

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  # End-to-end tests launch the built Electron window and use Playwright.
  # Linux needs a virtual display; Windows runs the window directly.
  e2e:
    name: End-to-end · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
