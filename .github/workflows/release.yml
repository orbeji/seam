name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

  linux:
    name: Build Linux installers
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: xvfb-run -a npx vitest run --config vitest.e2e.config.ts

      - name: Build AppImage and .deb
        run: npx electron-builder --linux --publish never

      - name: Install the .deb and smoke-test the packaged app
        run: |
          sudo apt-get install -y ./release/*.deb
          SEAM_EXECUTABLE=/opt/Seam/seam xvfb-run -a npx vitest run \
            --config vitest.e2e.config.ts test/e2e/packaged.smoke.e2e.ts

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  windows:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npx vitest run --config vitest.e2e.config.ts

      - name: Build NSIS installer
        run: npx electron-builder --win --publish never

      - name: Install silently and smoke-test the packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *setup*.exe | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not produced' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait

          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter seam.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installed) {
            $installed = Get-ChildItem release\win-unpacked -Filter seam.exe | Select-Object -First 1
          }
          if (-not $installed) { throw 'The installed executable was not found' }

          "SEAM_EXECUTABLE=$($installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          npx vitest run --config vitest.e2e.config.ts test/e2e/packaged.smoke.e2e.ts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*setup*.exe
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes from the changelog
        run: npm run release:notes > release-notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md --draft
          else
            gh release create "$TAG" artifacts/* \
              --draft \
              --title "Seam ${TAG#v}" \
              --notes-file release-notes.md
          fi
